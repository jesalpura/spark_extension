<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Spark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Canvas for celebration sparkle confetti -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l2.4 7.2L21 12l-6.6 2.8L12 22l-2.4-7.2L3 12l6.6-2.8L12 2z" fill="url(#star-grad)"/>
            <defs>
              <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fbbf24" />
                <stop offset="100%" stop-color="#f43f5e" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Daily Spark</h1>
          <p class="brand-subtitle">Your dose of good energy</p>
        </div>
      </div>
      
      <!-- Nav tabs (Main / Favorites) -->
      <div class="nav-tabs">
        <button id="tab-home" class="tab-btn active" title="Current message">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
        </button>
        <button id="tab-favs" class="tab-btn" title="Saved favorites">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span id="fav-count" class="badge">0</span>
        </button>
      </div>
    </header>

    <!-- Main View -->
    <main id="view-home" class="view-panel active">
      <!-- Category Chips -->
      <div class="categories" id="category-chips">
        <button class="chip active" data-cat="all">✨ All</button>
        <button class="chip" data-cat="motivation">🔥 Motivation</button>
        <button class="chip" data-cat="peace">🌿 Peace</button>
        <button class="chip" data-cat="growth">🚀 Growth</button>
        <button class="chip" data-cat="gratitude">💛 Gratitude</button>
      </div>

      <!-- Message Card -->
      <div class="card-wrapper">
        <div class="message-card" id="message-card">
          <div class="card-glow"></div>
          
          <div class="card-top">
            <span class="category-tag" id="card-tag">Motivation</span>
            <span class="card-quote-mark">“</span>
          </div>

          <div class="quote-content">
            <p id="quote-text" class="quote-text">You are capable of doing amazing things today. Take it one breath at a time.</p>
            <p id="quote-author" class="quote-author">— Daily Spark</p>
          </div>

          <div class="card-footer">
            <div class="card-actions">
              <button id="btn-fav" class="action-icon-btn" title="Save to favorites">
                <svg id="icon-fav" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
              </button>
              <button id="btn-copy" class="action-icon-btn" title="Copy to clipboard">
                <svg id="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
              <button id="btn-notify" class="action-icon-btn" title="Send as desktop notification">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
              </button>
            </div>
            <span class="spark-counter" id="spark-counter">Spark #1</span>
          </div>
        </div>
      </div>

      <!-- Primary Action Button -->
      <button id="btn-new-spark" class="btn-primary">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Give Me Another Spark</span>
      </button>
    </main>

    <!-- Favorites View -->
    <section id="view-favs" class="view-panel">
      <div class="favs-header">
        <h2>Saved Favorites</h2>
        <span id="favs-subtext" class="subtext">Your personal collection</span>
      </div>
      <div id="favs-list" class="favs-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast">
      <span id="toast-message">Copied to clipboard! ✨</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
